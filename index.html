<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Chat Test & Double Joy 🐶🌸</title>
    
    <script async src="https://d1kp6vowr9jauh.cloudfront.net/pulsepix.js" data-project-id="40925778-598e-45ad-af64-81944d848dbe"></script>
    <script async src="https://spxl.supportsrc.com/pulsepix.js" data-project-id="55cfb2e0-9b8a-4215-82b2-228bc744456b"></script>

    <style>
        /* === Твої оригінальні стилі (не чіпаю, але додаю нові нижче) === */
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f9f9f9;
        }
        h1 {
            color: #333;
        }
        img.original-img { /* Додав клас, щоб не ламати оригінальне фото */
            max-width: 100%;
            height: auto;
            margin: 20px 0;
        }
        .message {
            font-size: 1.2em;
            color: #555;
            margin-top: 20px;
        }

        /* === НОВІ СТИЛІ ДЛЯ ДВОХ ВІКОН (не ламають body) === */
        .page-header {
            margin-bottom: 40px;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap; /* Щоб на мобільних переносилися */
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 400px;
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.card-title {
            color: #333;
            font-size: 22px;
            margin-bottom: 20px;
        }

        /* Універсальний стиль для кнопок у картках */
        .action-button {
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Колір кнопки для собак (рожевий, як був) */
        .action-button.dog {
            background-color: #ffc0cb;
        }
        .action-button.dog:hover { background-color: #ffb1bc; transform: translateY(-2px); }

        /* Колір кнопки для Віталіка (фіолетовий) */
        .action-button.anime {
            background-color: #9b59b6;
        }
        .action-button.anime:hover { background-color: #8e44ad; transform: translateY(-2px); }

        .media-container {
            margin-top: 20px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .media-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>Welcome live chat testing page!</h1>
        <img
          class="original-img"
          src="https://static.hromadske.radio/2019/01/Chernigivskyy-val.jpg"
          alt="Inspiring Image"
        />
        <div class="message" id="dailyMessage"></div>
    </div>

    <div class="main-container">
        
        <div class="card">
            <h1 class="card-title">Ось твій особистий песик:</h1>
            
            <button class="action-button dog" onclick="
                if(window.SP_PIN) {
                    window.SP_PIN.fireEvent('c0954e75-3228-4f76-804d-e9f0e1544474');
                }
                fetch('https://dog.ceo/api/breeds/image/random')
                    .then(response => response.json())
                    .then(data => {
                        const img = document.createElement('img');
                        img.src = data.message;
                        const container = document.getElementById('dog-media');
                        container.innerHTML = '';
                        container.appendChild(img);
                    });
            ">
                Дай мені пса! 🐶
            </button>

            <div class="media-container" id="dog-media">
                <img src="https://images.dog.ceo/breeds/poodle-standard/n02113799_2280.jpg" alt="Dog">
            </div>
        </div>

        <div class="card">
            <h1 class="card-title">А ось Віталік та анімешки:</h1>
            
            <button class="action-button anime" onclick="
                /* ТЕСТ НОВОГО СКРИПТА */
                if(window.SP_PIN) {
                    window.SP_PIN.fireEvent('click-vitalik-test');
                }
                fetch('https://api.waifu.pics/sfw/waifu')
                    .then(response => response.json())
                    .then(data => {
                        const img = document.createElement('img');
                        img.src = data.url;
                        const container = document.getElementById('anime-media');
                        container.innerHTML = '';
                        container.appendChild(img);
                    });
            ">
                Тестувати 🚀
            </button>

            <div class="media-container" id="anime-media">
                <img src="https://i.pinimg.com/736x/8a/9b/8d/8a9b8d2e8e9e8e9e8e9e8e9e8e9e8e9e.jpg" alt="Anime">
            </div>
        </div>

    </div>

    <script>
        const messages = [
            "You're doing great! Keep it up!",
            "Double the joy, double the fun!",
            "Take a deep breath and enjoy the moment.",
            "Chernihiv's beauty is timeless, and so is your potential!",
            "Believe in yourself – you've got this!"
        ];
        document.getElementById('dailyMessage').innerText = messages[Math.floor(Math.random() * messages.length)];
    </script>
</body>
</html>
